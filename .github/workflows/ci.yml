name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod is tidy
        run: go mod tidy -diff
      - name: vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test (race detector, real Postgres)
        run: go test -race -count=1 -v ./... 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: no integration test was skipped
        run: "! grep -q 'TEST_PG_DSN not set' test.log"

  compose-e2e:
    # The real thing: build every image, start Postgres 17 + Redpanda + all services with
    # docker compose, and drive it through GraphQL with scripts/e2e.sh.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start stack
        run: make up
      - name: end-to-end
        run: make e2e
      - name: service logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail 200
      - name: stop
        if: always()
        run: make down
